name: Build Linux installer

# Отдельный от Windows workflow: в Actions можно запускать любой из них независимо.
on:
  push:
    tags: ["v*"]            # тег v1.0.0 соберёт и Windows, и Linux (два независимых workflow)
  workflow_dispatch:         # ручной запуск: Actions -> Build Linux installer -> Run workflow
    inputs:
      ytdlp_version:
        description: "Версия yt-dlp (пусто = последняя), например 2025.10.22"
        required: false
      publish_release:
        description: "Прикрепить файлы к GitHub Release (нужен существующий тег, выбранный в Use workflow from)"
        type: boolean
        default: false

permissions:
  contents: write            # нужно, чтобы прикрепить файлы к Release

jobs:
  build:
    # ubuntu-22.04 (glibc 2.35): собранная программа запустится и на более новых дистрибутивах
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
      YTDLP_VERSION: ${{ inputs.ytdlp_version }}
      # На Linux берётся статическая сборка FFmpeg от BtbN (последняя); закрепление версии для неё не поддерживается.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки для Qt / WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libasound2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3 libfontconfig1 libcups2 libxi6 libxcursor1 libglib2.0-0

      - name: Зависимости Python
        run: pip install -r requirements.txt

      - name: yt-dlp и FFmpeg в bin/
        run: python tools/fetch_binaries.py

      - name: Иконка
        run: python tools/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: PyInstaller (onedir)
        run: pyinstaller --noconfirm --clean Zephyrus.spec

      - name: "Проверка: исполняемый файл на месте"
        run: |
          test -x dist/Zephyrus/Zephyrus
          ls dist/Zephyrus/_internal/bin

      - name: Установщик .run и портативный архив
        run: bash linux/make_installer.sh

      - name: "Проверка установщика: установка и удаление без окна"
        run: |
          export HOME="$RUNNER_TEMP/h"
          mkdir -p "$HOME"
          RUN="$(ls "$GITHUB_WORKSPACE"/installer/Output/*.run)"
          "$RUN" --user -y
          test -x "$HOME/.local/opt/Zephyrus/Zephyrus"
          "$HOME/.local/opt/Zephyrus/uninstall.sh" --uninstall -y

      - uses: actions/upload-artifact@v4
        with:
          name: Zephyrus-Linux
          path: installer/Output/*

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
          generate_release_notes: true
